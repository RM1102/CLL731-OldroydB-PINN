# Runs the one-command setup on fresh Windows and macOS machines, exactly as a
# user would, then checks the notebook, the predictor and the GUI backend.
name: setup-test
on:
  push:
    branches: [windows-test]
  workflow_dispatch:
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One-command setup and quick check (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: setup_and_run.bat test
      - name: One-command setup and quick check (macOS)
        if: runner.os == 'macOS'
        run: bash setup_and_run.sh test
      - name: Notebook end to end, predictor, GUI backend
        shell: bash
        run: |
          PY=.venv/bin/python
          if [ -f .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; fi
          $PY -m jupyter nbconvert --execute --to notebook --output executed.ipynb 05_notebook/CLL731_OldroydB_PINN.ipynb
          $PY -c "import nbformat; nb = nbformat.read('05_notebook/executed.ipynb', 4); e = [o.ename for c in nb.cells if c.cell_type == 'code' for o in c.get('outputs', []) if o.output_type == 'error']; print('notebook errors:', e); assert not e"
          $PY predict.py --case eps0.02 --De 0.2 --dp --point 0.5 0.3
          $PY -c "import matplotlib, matplotlib.pyplot; print('GUI window backend:', matplotlib.get_backend())"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-selftest-${{ matrix.os }}
          path: gui_selftest.png
